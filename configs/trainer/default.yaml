_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
# Hoch genug, dass Early Stopping (patience 5 auf val/auc_video) das Training
# beendet, nicht das Epochen-Limit — VideoMAE Phase 2 underfittete noch bei
# Epoche 10 (train acc 0.66).
max_epochs: 30

accelerator: gpu # geändert auf gpu
devices: 1

# Standard fürs Transformer-Finetuning: kappt seltene Gradienten-Spikes, die
# das Phase-2-End-to-End-Training (bf16, kleine effektive Batches) sonst still
# entgleisen lassen können.
gradient_clip_val: 1.0

# mixed precision for extra speed-up
# precision: 16

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# set True to to ensure deterministic results
# makes training slower but gives more reproducibility than just setting seeds
deterministic: False

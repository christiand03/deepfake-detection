# @package _global_

defaults:
  - override /hydra/sweeper: optuna

optimized_metric: "val/auc_video"

hydra:
  mode: "MULTIRUN"

  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper

    storage: null
    study_name: null
    n_jobs: 1

    direction: maximize
    n_trials: 10

    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 3

    # NEUER SUCHRAUM FÜR TRANSFORMER:
    params:
      # Learning Rate
      model.optimizer.lr: tag(log, interval(0.000001, 0.0001))

      # Batch Size
      data.batch_size: choice(4, 8, 16)

      # Weight Decay
      model.optimizer.weight_decay: choice(0.0, 0.01, 0.1)

      # Optional: Transformer-spezifische Parameter
      # model.net.dropout: choice(0.1, 0.3, 0.5)

_target_: src.models.VideoMAE_module.VideoMAEModule

model_name_or_path: "MCG-NJU/videomae-base"
num_labels: 2
gradient_checkpointing: true  # spart VRAM (Recompute im Backward); für 8-GB-GPUs nötig

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
  weight_decay: 0.05

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 3

_target_: src.models.wav2vec2_module.Wav2Vec2DeepfakeModule

# Modellselection
model_name_or_path: "facebook/wav2vec2-base"
freeze_feature_extractor: True
# Phase 1 (Default): Backbone komplett einfrieren, nur den Kopf (projector + classifier)
# trainieren. Cold-Full-Finetuning des Encoders konvergiert hier nicht (Loss bleibt bei ln2,
# AUC bei Zufall). Frozen-Backbone ist die robuste Baseline (siehe docs/model.md §7).
# Phase 2: false + warmstart_ckpt für End-to-End-Finetuning.
freeze_backbone: True

# Attention-Implementierung fürs TRAINING: "sdpa" (schneller) oder "eager".
# explain_audio.py / die API laden Checkpoints immer mit eager (AttnLRP) —
# s. configs/model/videomae.yaml für Details.
attn_implementation: sdpa

# CE-Klassengewichte [real, fake]. "auto" berechnet Inverse-Frequenz-Gewichte
# zur Fit-Zeit aus dem Train-Split (immer konsistent mit data.label_type und
# Datenstand; zuletzt [0.536, 7.374]). Liste = Override, null = ungewichtet.
class_weights: auto

# Label Smoothing (z. B. 0.1) weicht die One-Hot-Targets auf. 0.0 = aus.
label_smoothing: 0.0

# Layer-wise LR-Decay für Phase 2 (z. B. 0.75); null = einheitliche LR.
# Wirkt nur bei freeze_backbone=false.
llrd_decay: null

# PEFT: "lora" trainiert Low-Rank-Adapter auf den Attention-Q/V-Projektionen
# statt des vollen Encoders (Phase-2-Alternative; s. configs/model/videomae.yaml).
# Erfordert freeze_backbone=false; nicht mit llrd_decay kombinierbar.
peft_mode: none   # none | lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0005   # höhere LR für Head-only-Training (vorher 5e-5 fürs – nicht konvergierende – Full-Finetuning)
  weight_decay: 0.05  # angeglichen an VideoMAE (vorher 0.01) für vergleichbare Regularisierung

# Linearer Warmup (5 % der Steps) + Cosine-Decay, pro Optimizer-Step.
# ReduceLROnPlateau war über 10 Epochen mit patience 3 praktisch wirkungslos.
scheduler:
  _target_: src.utils.lr_schedulers.linear_warmup_cosine
  _partial_: true
  warmup_ratio: 0.05
  # Decay-Horizont in Epochen, entkoppelt von trainer.max_epochs — siehe
  # configs/model/videomae.yaml für die Begründung.
  horizon_epochs: 15

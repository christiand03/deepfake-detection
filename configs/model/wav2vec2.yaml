_target_: src.models.wav2vec2_module.Wav2Vec2DeepfakeModule

# Modellselection
model_name_or_path: "facebook/wav2vec2-base"
freeze_feature_extractor: True
# Phase 1 (Default): Backbone komplett einfrieren, nur den Kopf (projector + classifier)
# trainieren. Cold-Full-Finetuning des Encoders konvergiert hier nicht (Loss bleibt bei ln2,
# AUC bei Zufall). Frozen-Backbone ist die robuste Baseline (siehe docs/model.md §7).
# Phase 2: false + warmstart_ckpt für End-to-End-Finetuning.
freeze_backbone: True

# CE-Klassengewichte [real, fake]. Mit segment-genauen Chunk-Labels ist die
# Fake-Klasse selten (label_audio ~7 % der Chunks) — Inverse-Frequenz-Gewichte
# aus dem Train-Split (scripts/relabel_chunks.py gibt sie aus). null = ungewichtet.
class_weights: [0.536, 7.374]

# Layer-wise LR-Decay für Phase 2 (z. B. 0.75); null = einheitliche LR.
# Wirkt nur bei freeze_backbone=false.
llrd_decay: null

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0005   # höhere LR für Head-only-Training (vorher 5e-5 fürs – nicht konvergierende – Full-Finetuning)
  weight_decay: 0.05  # angeglichen an VideoMAE (vorher 0.01) für vergleichbare Regularisierung

# Linearer Warmup (5 % der Steps) + Cosine-Decay, pro Optimizer-Step.
# ReduceLROnPlateau war über 10 Epochen mit patience 3 praktisch wirkungslos.
scheduler:
  _target_: src.utils.lr_schedulers.linear_warmup_cosine
  _partial_: true
  warmup_ratio: 0.05

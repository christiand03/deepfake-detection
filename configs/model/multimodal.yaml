_target_: src.models.multimodal_module.MultimodalDeepfakeModule

video_model_name: "MCG-NJU/videomae-base"
audio_model_name: "facebook/wav2vec2-base"

# Cross-Attention Fusion Parameter
fusion_dim: 512     # Gemeinsame Dimension der Cross-Attention-Blöcke
num_heads: 8        # Muss fusion_dim teilen (512 / 8 = 64 pro Head)
dropout: 0.3        # gegen Fusion-Head-Overfitting (train-loss 0.37 << val-loss 1.03 im 2. Lauf)
num_classes: 2
fusion_mode: cross_attention  # cross_attention | concat | video_only | audio_only (Ablation, §4/§7.10)

# Phase 1 (Default): Backbones einfrieren → nur Fusion-Head trainieren
# Phase 2: false + warmstart_ckpt, mit niedrigerer LR end-to-end fine-tunen
freeze_backbone: True

gradient_checkpointing: true  # nur in Phase 2 aktiv (unfrozen Backbones); spart VRAM

# Attention-Implementierung BEIDER Backbones fürs TRAINING: "sdpa" (schneller)
# oder "eager". explain_multimodal.py / die API laden Checkpoints immer mit
# eager (AttnLRP) — s. configs/model/videomae.yaml für Details.
attn_implementation: sdpa

# CE-Klassengewichte [real, fake]. "auto" berechnet Inverse-Frequenz-Gewichte
# zur Fit-Zeit aus dem Train-Split (immer konsistent mit data.label_type und
# Datenstand; zuletzt [0.557, 4.905]). Liste = Override, null = ungewichtet.
class_weights: auto

# Label Smoothing (z. B. 0.1) weicht die One-Hot-Targets auf. 0.0 = aus.
label_smoothing: 0.0

# Mixup (Beta(alpha, alpha), z. B. 0.2) — beide Modalitäten werden mit demselben
# lam/perm gemischt, damit die A/V-Paarung erhalten bleibt. Nur im Training
# aktiv; bei adv_train automatisch übersprungen. 0.0 = aus.
mixup_alpha: 0.0

# Layer-wise LR-Decay für Phase 2 (z. B. 0.75): Backbone-Block i trainiert mit
# lr * decay^(Tiefe - i), der Fusion-Head mit voller lr. null = einheitliche LR.
# Wirkt nur bei freeze_backbone=false.
llrd_decay: null

# PEFT: "lora" trainiert Low-Rank-Adapter auf den Attention-Q/V-Projektionen
# BEIDER Backbones statt Full-Finetuning (Phase-2-Alternative; s.
# configs/model/videomae.yaml). Erfordert freeze_backbone=false; nicht mit
# llrd_decay kombinierbar.
peft_mode: none   # none | lora
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4          # Für Phase 2 (unfreeze) auf 1e-5 reduzieren
  weight_decay: 0.1   # erhöht (0.05→0.1) gegen Overfitting

# Linearer Warmup (5 % der Steps) + Cosine-Decay, pro Optimizer-Step.
# ReduceLROnPlateau war über 10 Epochen mit patience 3 praktisch wirkungslos.
scheduler:
  _target_: src.utils.lr_schedulers.linear_warmup_cosine
  _partial_: true
  warmup_ratio: 0.05
  # Decay-Horizont in Epochen, entkoppelt von trainer.max_epochs — siehe
  # configs/model/videomae.yaml für die Begründung.
  horizon_epochs: 15

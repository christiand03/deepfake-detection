# path to root directory
# this requires PROJECT_ROOT environment variable to exist
# you can replace it with "." if you want the root to be the current working directory
root_dir: ${oc.env:PROJECT_ROOT}

# path to data directory
# Honours DEEPFAKE_DATA_DIR if set, else falls back to <root>/data/. The env var
# lets W&B Launch jobs (which run in a temporary repo clone) point at the real,
# absolute data location on the host without per-launch overrides. Normal local
# runs are unaffected as long as the env var is unset.
data_dir: ${oc.env:DEEPFAKE_DATA_DIR,${paths.root_dir}/data/}

# path to logging directory (same env-var override mechanism as data_dir)
log_dir: ${oc.env:DEEPFAKE_LOG_DIR,${paths.root_dir}/logs/}

# directory the best checkpoint is exported to after training (see export_ckpt in
# train.yaml). Honours DEEPFAKE_CKPT_DIR so W&B Launch jobs (temp clone) can write
# to an absolute host path instead of the throwaway run dir; else <root>/checkpoints/.
export_dir: ${oc.env:DEEPFAKE_CKPT_DIR,${paths.root_dir}/checkpoints/}

# path to output directory, created dynamically by hydra
# path generation pattern is specified in `configs/hydra/default.yaml`
# use it to store all files generated during the run, like ckpts and metrics
output_dir: ${hydra:runtime.output_dir}

# path to working directory
work_dir: ${hydra:runtime.cwd}

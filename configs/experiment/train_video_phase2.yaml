# @package _global_

# Phase 2 — VideoMAE End-to-End-Finetuning (Backbone ENTFROREN), warm-gestartet vom
# sauberen Phase-1-Checkpoint. Hier kann der Backbone forgery-spezifische Features lernen
# (Phase 1 = nur Linear-Probe auf Kinetics-Features, ~0,56 AUC).
# Run/Launch: experiment=train_video_phase2

defaults:
  - override /data: deepfake_video
  - override /model: videomae
  - override /logger: wandb
  - override /trainer: gpu

ckpt_export_name: videomae_phase2

# Warm-Start vom Phase-1-Checkpoint (nur Gewichte, frischer Optimizer/LR).
# ${paths.export_dir} = DEEPFAKE_CKPT_DIR (W&B-Launch) bzw. ./checkpoints/ (lokal).
warmstart_ckpt: ${paths.export_dir}/videomae.ckpt

# Full-Finetune unter SDPA: ohne die materialisierte O(N²)-Attention passt bs 6
# direkt (eager-Obergrenze war bs 2, s. docs/model.md §6.3/§6.4). Effektive
# Batch-Größe bleibt 6 wie zuvor (2 × 3) — gleiche Trainings-Dynamik, ~3× Durchsatz.
data:
  batch_size: 6
trainer:
  accumulate_grad_batches: 1  # 6 × 1 = effektiv 6 (wie vorher 2 × 3)

model:
  freeze_backbone: false
  # Layer-wise LR-Decay: tiefe Blöcke nahe der Head-LR, frühe Blöcke deutlich
  # niedriger — Standard fürs Transformer-Finetuning, schützt die pretrained Features.
  llrd_decay: 0.75
  optimizer:
    lr: 1e-5   # niedriger fürs End-to-End-Finetuning (vorher 1e-4 in Phase 1)

tags: ["videomae", "video", "phase2", "end-to-end"]

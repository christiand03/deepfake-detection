# @package _global_

# Phase 4.2 — Adversarial fine-tuning (defense) for the multimodal detector.
# PGD-augmented training with a 1:1 clean/adv mix (batch-splitting), perturbing
# video and/or audio per adv_modalities.
# Run: python src/train.py experiment=train_multimodal_adversarial

defaults:
  - override /data: deepfake_multimodal
  - override /model: multimodal
  - override /logger: wandb
  - override /trainer: gpu

ckpt_export_name: multimodal_adv

# Warm-Start vom sauberen Phase-1-Multimodal. ${paths.export_dir} = DEEPFAKE_CKPT_DIR
# (W&B-Launch) bzw. ./checkpoints/ (lokal).
warmstart_ckpt: ${paths.export_dir}/multimodal.ckpt

# Schwerster Pfad: beide Backbones trainierbar + PGD. bs 2 ist host-RAM-knapp (s. §6.6) → bs 1.
data:
  batch_size: 1
trainer:
  accumulate_grad_batches: 6  # 1 × 6 = effektiv 6

model:
  adv_train: true
  freeze_backbone: false   # Phase 2: Backbones trainierbar, sonst härtet das
                           # adversariale Training nur den Fusion-Head auf eingefrorenen Features
  optimizer:
    lr: 1e-5             # niedriger fürs Phase-2-Finetuning (entfrorene Backbones)
  adv_epsilon: 0.03        # L∞ budget for the video modality
  adv_audio_epsilon: 0.03  # L∞ budget for the audio modality
  adv_steps: 7             # PGD iterations per step
  adv_modalities: both     # video | audio | both

tags: ["multimodal", "cross-attention", "adversarial-training", "phase4", "defense"]

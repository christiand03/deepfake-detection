# @package _global_

# Ablation — Balanced Sampling statt CE-Klassengewichten (Phase 1, Multimodal).
# Das kombinierte label (real nur wenn BEIDE Modalitäten echt) ist unausgewogen
# (~10 % Fake, auto-Gewicht ~4,9). Statt den Loss zu skalieren zieht hier ein
# WeightedRandomSampler ~50/50-Batches; der Loss bleibt ungewichtet.
# Vergleichsmetrik: val/auc_video gegen train_multimodal.
# Run/Launch: experiment=train_multimodal_balanced

defaults:
  - override /data: deepfake_multimodal
  - override /model: multimodal
  - override /logger: wandb
  - override /trainer: gpu

ckpt_export_name: multimodal_balanced

data:
  balanced_sampling: true

model:
  class_weights: null  # Sampler korrigiert die Imbalance bereits — nicht doppelt!

tags: ["multimodal", "fusion", "ablation", "balanced-sampling"]

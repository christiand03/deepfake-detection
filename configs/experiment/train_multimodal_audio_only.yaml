# @package _global_

# Ablation: nur Audio — der Video-Pool-Vektor wird genullt, Klassifikator unverändert.
# Zeigt die Leistung der Fusion-Architektur ohne Video-Signal.
# Run: python src/train.py experiment=train_multimodal_audio_only

defaults:
  - override /data: deepfake_multimodal
  - override /model: multimodal
  - override /logger: wandb
  - override /trainer: gpu

ckpt_export_name: multimodal_audio_only

model:
  fusion_mode: audio_only

tags: ["multimodal", "ablation", "audio_only", "fusion"]

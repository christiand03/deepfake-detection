_target_: src.data.multimodal_datamodule.MultimodalDataModule
data_dir: ${paths.data_dir}/processed
batch_size: 16      # Phase-1-Wert (beide Backbones eingefroren, ~5,7 GB). Phase 2 heruntersetzen (z. B. 1)!
num_workers: 2
pin_memory: True
label_type: "label"
augment: true  # Train-only-Augmentation in beiden Modalitäten gegen Identitäts-Memorierung
# "standard" | "robust": robust ergänzt JPEG/Blur/Downscale (Video) und Time
# Masking (Audio) — Social-Media-Simulation als Trainings-Augmentation.
augment_strength: standard
# Balanced Sampling (WeightedRandomSampler) statt Shuffle; Alternative zu
# model.class_weights (dann auf null setzen — nicht doppelt korrigieren!).
balanced_sampling: false

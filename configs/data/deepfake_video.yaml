_target_: src.data.videomae_datamodule.VideoMAEDataModule
data_dir: ${paths.data_dir}/processed
batch_size: 16  # Phase-1-Wert (Backbone eingefroren, ~5,3 GB). Phase 2 heruntersetzen (z. B. 2)!
num_workers: 2
pin_memory: True
label_type: "label_video"  # Video-only-Modell: beobachtbares Ziel (nicht das kombinierte "label")
augment: true  # Train-only-Augmentation (Flip / Color-Jitter / Random-Crop) gegen Identitäts-Memorierung
# "standard" | "robust": robust ergänzt JPEG-Artefakte / Gaussian Blur /
# Downscale-Upscale (je p=0.3) — Social-Media-Simulation als Trainings-
# Augmentation (DFDC-Gewinner-Rezept, zahlt direkt auf Phase 3 ein).
augment_strength: standard
# Balanced Sampling (WeightedRandomSampler): zieht Train-Batches ~50/50 statt der
# nativen ~94/6-Verteilung. Alternative zu model.class_weights (dann auf null
# setzen — nicht doppelt korrigieren!). Ablation: experiment=train_video_balanced
balanced_sampling: false
# Batches, die jeder Worker vorlädt (nur aktiv bei num_workers>0). Höher
# versteckt I/O-Latenz, kostet aber Host-RAM: In-Flight ≈ num_workers ×
# prefetch_factor × batch_size × ~9,6 MB (float32-Video-Sample) ≈ 1,2 GB bei 4.
# Auf 4 gesetzt nach Profiling (Data-Wait 0,599→0,347 s/Batch, −42 %, ~1,4×
# Durchsatz; Messung s. docs/performance_roadmap.md §1.9). 6 lohnt nicht
# (Data-Wait ≈ Compute, RAM nähert sich der Commit-Pressure-Zone).
prefetch_factor: 4
# Eval-only Frame-Order-Perturbation (Spatial-Dominance-Diagnose): null | tubelet_shuffle
# | frame_shuffle. tubelet_shuffle permutiert die 8 Tubelet-Paare (VideoMAE tubelet_size=2),
# erhält also die Intra-Tubelet-Bewegung; frame_shuffle zerstört jede Reihenfolge.
# Unverändertes AUROC ⇒ Modell ignoriert zeitliche Ordnung. NIE fürs Training aktivieren.
frame_perturbation: null
frame_perturbation_seed: 42
# ── Manipulations-Masken (Relevanz-Regularisierung) ──────────────────────────
# Verzeichnis mit {split}_masks.npz aus scripts/build_manipulation_masks.py.
# null (Default) = Masken komplett aus; alle Phase-1-4-Konfigurationen bleiben
# unverändert. Gesetzt liefert jedes Item zusätzlich loc_mask (16,14,14),
# loc_frame_gate (16,) und has_loc_mask () — nullgefüllt für Chunks ohne Maske,
# damit die Batch-Form konstant bleibt und der Default-Collate weiter greift.
mask_dir: null
# Ob maskierte Chunks zusätzlich zum Flip auch den Random-Resized-Crop bekommen.
# Aus: Die Crop-Seite liegt bei 12,6–14,0 Zellen des 14×14-Gitters, das Nachspielen
# kostet also bis zu eine ganze Zelle (~7 % des Bildes) — mehr als eine typische
# Mundmaske groß ist. Der Flip ist bei jeder Auflösung exakt und wird immer
# nachgespielt (sonst lernt das Modell die Manipulation auf der falschen Gesichtshälfte).
mask_allow_scale_crop: false
# Maskierte Chunks im Trainings-Sampler hochgewichten (~6 % → ~50 % pro Batch).
# Ohne das feuert der Lokalisierungs-Loss auf etwa einem von zwanzig Samples und
# sein Gradient verschwindet neben dem Klassifikationsterm.
mask_oversample: false

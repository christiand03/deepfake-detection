# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: mnist
  - model: mnist
  - callbacks: default
  - logger: null # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["dev"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True

# simply provide checkpoint path to resume training (full Lightning resume:
# restores optimizer/scheduler/epoch — your optimizer/LR config is NOT re-applied)
ckpt_path: null

# warm-start: load ONLY the model weights from this checkpoint into a freshly-built
# model, then train with a FRESH optimizer/LR/epoch counter. Use for multimodal
# Phase 2 (end-to-end fine-tuning from a Phase 1 frozen-backbone checkpoint):
#   model.freeze_backbone=false model.optimizer.lr=1e-5 warmstart_ckpt=<phase1.ckpt>
# Mutually exclusive with ckpt_path (which is a full resume, not a warm-start).
warmstart_ckpt: null

# after training, copy the best checkpoint to a stable path (paths.export_dir) so
# the API/frontend can reuse it via its *_CKPT_PATH env vars. Set False to disable.
export_ckpt: True

# filename stem for the exported checkpoint (<export_dir>/<name>.ckpt). If null,
# it is derived from the model class (e.g. VideoMAEModule -> videomae). Experiment
# configs set this explicitly so adversarial runs don't overwrite the baselines.
ckpt_export_name: null

# seed for random number generators in pytorch, numpy and python.random.
# Fixed at 42 so all runs are reproducible and ablation arms differ ONLY in their
# config (not in random init / data order). Override per run for multi-seed studies,
# e.g. seed=43. (For full determinism also set trainer.deterministic=true — langsamer.)
seed: 42

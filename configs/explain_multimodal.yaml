# @package _global_

defaults:
  - _self_
  - data: deepfake_multimodal
  - model: multimodal
  - paths: default
  - extras: default
  - hydra: default
  - optional logger: null
  - optional trainer: default

task_name: "explain_multimodal"

# Checkpoint path is required (??? enforces this in Hydra)
ckpt_path: ???

explain:
  target_class: null   # null = explain predicted class; int = override for entire batch

  # Video
  frame_idx: 0         # Which frame to visualize (0–15 for 16-frame clips)
  video_save_path: "multimodal_lrp_video.png"

  # Audio
  audio_save_path: "multimodal_lrp_audio.png"
  smoothing_kernel: 160        # avg_pool1d kernel/stride for Layer 1 strip: 160 samples = 10 ms at 16 kHz
  sample_rate: 16000           # Wav2Vec2 input sample rate (Hz)

  # Combined figure (video row + audio row in one file
  combined_save_path: "multimodal_lrp_combined.png"

  # Layer 2 — word-level relevance via WhisperX forced alignment
  enable_layer2: true
  layer2_save_path: "multimodal_lrp_l2_words.png"
  whisperx_model: "base"       # WhisperX model size (tiny/base/small/medium/large)
  whisperx_device: null        # null = auto (cuda if available, else cpu)
  whisperx_language: "en"      # BCP-47 language code; change for non-English datasets
  cache_dir: "outputs/whisperx_cache"

  # Layer 3 — frequency-band summary via band-pass filtering
  enable_layer3: true
  layer3_save_path: "multimodal_lrp_l3_bands.png"

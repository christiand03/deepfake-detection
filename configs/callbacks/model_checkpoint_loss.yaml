# Checkpointing auf val/loss statt val/auc_video.
#
# Warum eine eigene Variante: Der Standard (callbacks/default.yaml) überwacht
# val/auc_video. Sobald ein Modell dort exakt 1.000 erreicht — was die
# warm-gestarteten Relevanz-Läufe sofort tun — ist kein späterer Wert mehr *strikt*
# besser, save_top_k=1 löst also nie wieder ein Speicher-Ereignis aus. Beobachtet am
# 2026-08-16: Run 0 lief 18.000 Batches durch, aber sowohl der Best- als auch der
# last.ckpt froren bei Batch 6.000 ein, und der Endzustand war unwiederbringlich weg.
# Genau das erzwang den kompletten Neulauf.
#
# val/loss sättigt nicht und bewegt sich weiter, sobald der Lokalisierungs-Strafterm
# die Klassifikation verschiebt — es ist damit sowohl der bessere Kanarienvogel
# (siehe docs/relevance_regularization.md §7.6) als auch das brauchbarere
# Checkpoint-Kriterium.
#
# every_n_train_steps sichert zusätzlich unabhängig vom Monitor: selbst wenn die
# Metrik sich nie verbessert, existiert am Ende ein Checkpoint des tatsächlichen
# Endzustands. Ohne das ist ein Lauf, dessen Metrik früh einfriert, nicht auswertbar.

defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}-step_{step:06d}-val_loss_{val/loss:.4f}"
  monitor: "val/loss"
  mode: "min"
  # ALLE Checkpoints behalten, nicht die besten k.
  #
  # Am 2026-08-17 verifiziert: save_top_k=2 speichert bei einem *steigenden* val/loss
  # die beiden FRÜHESTEN Validierungen — danach feuert kein Speicher-Ereignis mehr,
  # und last.ckpt friert mit ein (es ist bitweise eine Kopie des letzten Speicherstands,
  # kein eigenständiger Schreibvorgang am Trainingsende). Bei den λ>0-Läufen steigt
  # val/loss zwangsläufig, weil genau das der gemessene Trade-off ist. Ergebnis:
  # λ=0.02 und λ=0.1 hatten nur Checkpoints bei Batch 3.000 von 6.000, während die
  # Kontrolle (fallender val/loss) bis 6.000 durchspeicherte — die Arme waren damit
  # NICHT schrittgleich, obwohl alle 6.000 Batches trainiert hatten.
  #
  # -1 = alles behalten. Bei 4 Validierungen pro Lauf und ~1 GB je Checkpoint sind das
  # ~4 GB pro Lauf; das ist der Preis dafür, dass ein Vergleich überhaupt zulässig ist.
  # Wer Platz sparen muss, nutzt every_n_train_steps statt eines metrik-abhängigen
  # Kriteriums — aber NIE save_top_k, wenn die überwachte Metrik steigen darf.
  save_top_k: -1
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  # Praktisch deaktiviert — und das ist Absicht.
  #
  # Bei den Lokalisierungs-Läufen ist ein steigender val/loss das ERWARTETE Ergebnis:
  # genau dieser Anstieg IST der gemessene Trade-off zwischen Lokalisierung und
  # Klassifikationsgüte. Early Stopping auf val/loss würde also den Lauf abbrechen,
  # der das Ergebnis gerade produziert — dieselbe Fehlerklasse wie beim
  # RelevanceCollapseGuard, der am 2026-08-16 mit einer Referenz aus dem
  # Sanity-Check bei einem Drittel der Strecke abgebrochen hat.
  #
  # patience muss daher grösser sein als die Zahl der Validierungen im Lauf
  # (tests/test_checkpoint_config.py prüft das). 1000 heisst: greift nie, bleibt
  # aber als Callback vorhanden, falls ein Lauf wirklich divergiert (check_finite).
  monitor: "val/loss"
  mode: "min"
  patience: 1000

model_summary:
  max_depth: -1

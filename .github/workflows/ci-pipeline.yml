name: Python Project CI

# Löst die Pipeline bei jedem Push oder Pull-Request aus
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13.5"] # Hier eure Python-Version eintragen

    steps:
      # 1. Code aus dem Repository auschecken
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Python-Umgebung aufsetzen
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Abhängigkeiten installieren
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 4. Linter ausführen
      - name: Lint with flake8
        run: |
          # Stoppt den Build bei Fehlern. Zeigt an, wo die Fehler sind.
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # 5. Tests mit pytest ausführen
      - name: Test with pytest
        run: |
          pytest

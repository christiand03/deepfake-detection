[tool.ruff]
target-version = "py311"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = ["E501", "F722"]

[tool.ruff.lint.per-file-ignores]
# F821: jaxtyping shape strings use bare axis names (e.g. Float[Tensor, "batch time"]).
# UP037: do NOT auto-unquote single-token jaxtyping axes (e.g. "batch" -> batch); the
#        unquoted form crashes @beartype-decorated methods at import time.
"src/models/*" = ["F821", "UP037"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

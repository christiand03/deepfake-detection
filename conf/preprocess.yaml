# @package _global_

data:
  # Root of the raw AV-Deepfake1M video tree:  data/train/{identity}/{clip}/{segment}/{variant}.mp4
  root: data/train
  # Root of the JSON sidecar tree: data/train_metadata/train_metadata/{identity}/{clip}/{segment}/{variant}.json
  metadata_root: data/train_metadata/train_metadata
  # Where FFmpeg-normalised AV files are written (persistent — re-runs skip already-done files)
  normalized_dir: data/normalized
  # Where per-split HDF5 + CSV outputs land
  output_dir: data/processed

preprocessing:
  num_frames: 16
  target_fps: 25
  sample_rate: 16000
  # 16 frames / 25 fps * 16000 Hz = 10240 samples per chunk
  audio_samples_per_chunk: 10240
  # A chunk counts as fake only if it overlaps a fake segment by >= min_label_overlap_s
  # seconds OR >= min_label_overlap_frac of the segment's duration (short segments).
  # Without this, boundary-grazing chunks (few ms overlap, ~99% real content) get
  # fake labels — label noise on exactly the hard examples.
  min_label_overlap_s: 0.1
  min_label_overlap_frac: 0.5
  # H.264 CRF for the fps re-encode of off-fps sources (sources already at
  # target_fps are read directly, no re-encode). 18 = visually lossless —
  # the libx264 default (23) degrades the high-frequency forgery traces.
  reencode_crf: 18

face_extraction:
  crop_scale: 1.4
  target_size: 224
  # Path to the face_landmarker.task model bundle (mediapipe >= 0.10 Tasks API).
  # Download from: https://storage.googleapis.com/mediapipe-models/face_landmarker/
  #   face_landmarker/float16/1/face_landmarker.task
  model_path: models/face_landmarker.task
  # "image" (default) = per-frame detection (current dataset was built with this).
  # "video" = MediaPipe VIDEO mode: tracks the face between frames — faster and
  # temporally smoother boxes, but slightly different crops. Only switch
  # together with a full regeneration (validate via scripts/validate_processed.py).
  running_mode: image

run:
  # Set to a positive integer to cap the number of videos processed (useful for smoke runs)
  max_videos: null
  # Identity-based split ratios (applied after scanning; overrides JSON sidecar split field)
  val_ratio: 0.15
  test_ratio: 0.15
  # Seed for the deterministic per-identity hash split. Stable across re-runs; with
  # few identities pick a seed giving non-empty val/test AND a train-heavy chunk split.
  # Current dataset (max_videos=12000, ~30 identities): seed=11 → 9959/861/1180
  # Videos (train/val/test). The run logs split counts and warns on an empty split.
  split_seed: 11
  # Skip videos whose video_id already appears in an existing output CSV
  skip_existing: true
  # Parallel extraction workers (FFmpeg/decord/MediaPipe). 0 = sequential
  # (previous behaviour). All HDF5/CSV writing stays in the main process.
  # RAM budget: each worker holds one decoded video + MediaPipe (~1-2 GB);
  # 3 is a sensible maximum on the 16-GB box. Expected ~3x on a full regen.
  num_workers: 0
  log_level: INFO
